# 7 concurrent / 100 of 1261 unique johnu sessions.
# Server knobs are on the vLLM process (see benchmark/serve.sh), not here.
load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 20
      num_sessions: 200
      duration: 900
      warmup: 300
  num_workers: 128
  worker_max_concurrency: 20000
  request_timeout: 3000000000
  base_seed: 1787548644060
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: mistralai/Ministral-3-8B-Instruct-2512
  base_url: http://localhost:8000
  verify_ssl: false
tokenizer:
  pretrained_model_name_or_path: mistralai/Ministral-3-8B-Instruct-2512
  fix_mistral_regex: true
data:
  type: weka_trace_replay
  weka_trace_replay:
    trace_files:
      - "/home/ubuntu/dev/Inference-perf-internal/freeinference_converted_to_weka_1000.jsonl"
    num_dataset_entries: 200
    duplicate_sessions_target: 200
    min_events: 100
    compiled_store_path: "/home/ubuntu/dev/Inference-perf-internal/compiled-artifacts-mistral-instruct"
    compile_parallelism_mode: "process"
    compile_workers: 128
    compile_inflight_limit: 128
    use_static_model: true
    static_model_name: "mistralai/Ministral-3-8B-Instruct-2512"
    default_block_size: 64
    skip_invalid_files: true
    clamp_substituted_output_to_recorded: true
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
